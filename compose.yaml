
# Landed with Anthropic API authentication
services:
  web:
    build: .
    image: landed:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - landed-data:/app/data
      - landed-assets:/app/asset-root
    environment:
      NODE_ENV: production
      REPO_ROOT: /app
      ASSET_ROOT: /app/asset-root
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: sonnet
    deploy:
      replicas: 1

volumes:
  landed-data:
  landed-assets:
